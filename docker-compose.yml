version: '3.9'

# ── Local development infrastructure ─────────────────────────────────────────
# Run: docker-compose up -d
# Stop: docker-compose down
# Nuke volumes: docker-compose down -v

services:

  postgres:
    image: postgres:16-alpine
    container_name: alumni_postgres
    environment:
      POSTGRES_DB: alumni_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: alumni_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alumni_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: yashdubey262@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional: Redis Commander (Redis GUI) ────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: alumni_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: