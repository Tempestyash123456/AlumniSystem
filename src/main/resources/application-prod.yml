spring:
  datasource:
    # URL, Username, and Password are now handled by DatabaseConfig.java
    # based on DATABASE_URL or SPRING_DATASOURCE_URL
    # url: ${SPRING_DATASOURCE_URL}
    # username: ${SPRING_DATASOURCE_USERNAME}
    # password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://your-frontend.vercel.app}
  upload:
    dir: ${APP_UPLOAD_DIR:/app/uploads}
    max-file-size-mb: 100
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
  frontend-url: ${FRONTEND_URL:https://your-frontend.vercel.app}

logging:
  level:
    com.university.alumni: DEBUG
    org.springframework: INFO
    org.springframework.boot: DEBUG
    org.flywaydb: DEBUG